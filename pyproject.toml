[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.0",
    "hydra-submitit-launcher>=1.2.0",
    "lightning",
    "torch>=2.9.1",
    "torch-brain",
    "matplotlib>=3.10.8",
    "torchmetrics>=1.8.2",
    "wandb>=0.24.0",
    "auditorydecoding",
    "optuna>=4.8.0",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "pytest>=8.0.0", "ruff==0.15.22"]
notebook = ["ipykernel>=7.2.0", "seaborn>=0.13.2"]
pipelines = ["mne~=1.11.0", "moabb~=1.4.3", "scikit-learn~=1.7.2"]
neuralbench = ["neuralbench==0.2.3", "neuralfetch==0.2.3", "moabb>=1.5.0"]

[tool.uv.sources]
torch-brain = { git = "https://github.com/neuro-galaxy/torch_brain", branch = "main" }
auditorydecoding = { git = "https://github.com/Neurosoft-Bioelectronics/auditorydecoding", branch = "main" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = [
    "torch-brain @ git+https://github.com/neuro-galaxy/torch_brain.git@main",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.22",
    "mne-bids>=0.19",
    "moabb>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

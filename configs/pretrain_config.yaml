defaults:
  - model: null
  - data: null
  - module: default
  - trainer: default
  - experiment: ???

hyperparameters:
  batch_size: 64
  sequence_length: 8.0
  sampling_rate: 200
  # num_channels: null
  # num_samples: null
  num_workers: 8
  learning_rate: 5e-4
  weight_decay: 1e-4

run:
  name: labram_pretrain
  seed: 0
  log_level: INFO
  resume_wandb_if_name_matches: false

stage:
  skip: false

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-pretrain
  save_dir: .
  log_model: false
  offline: false

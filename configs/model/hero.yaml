_target_: foundry.models.HEROModel

embed_dim: 64
canonical_rate: 128
num_spatial_slots: 8
num_temporal_slots: 4
local_window: 32
num_local_attn_blocks: 2
num_channels: ${hyperparameters.num_channels}
num_attn_heads: 8
channel_encoder_layers: 3
channel_encoder_kernel_size: 7
task_query_chunk_size: 256

# Controlled supervised ladder options. Reference HERO uses the defaults below.
temporal_mode: hierarchical       # hierarchical | flat
flat_num_local_attn_blocks: null  # null reuses num_local_attn_blocks
temporal_reduction: slots         # slots | mean (no temporal slots)
top_down_fusion: gated            # gated | add

# Sample-derived and optional absolute-position routing. Disabled remains the
# exact HERO control; every active source has an independently zeroable gate.
channel_context_mode: disabled    # disabled | local | relational | position | relational_position
context_dim: 32
context_encoder_layers: 3
context_encoder_kernel_size: 7
context_pool_factor: 2
relational_context_blocks: 2
relational_context_heads: 4
channel_type_enabled: false
absolute_position_enabled: null   # null derives from channel_context_mode
position_num_fourier_bands: 6
shuffle_relational_context: false

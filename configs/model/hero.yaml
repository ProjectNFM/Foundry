_target_: foundry.models.HEROModel

embed_dim: 64
canonical_rate: 128
num_spatial_slots: 8
num_temporal_slots: 4
local_window: 32
num_local_attn_blocks: 2
num_channels: ${hyperparameters.num_channels}
num_attn_heads: 8
channel_encoder_layers: 3
channel_encoder_kernel_size: 7
task_query_chunk_size: 256

# Controlled supervised ladder options. Reference HERO uses the defaults below.
temporal_mode: hierarchical       # hierarchical | flat
flat_num_local_attn_blocks: null  # null reuses num_local_attn_blocks
temporal_reduction: slots         # slots | mean (no temporal slots)
top_down_fusion: gated            # gated | add

_target_: foundry.models.tokenizer.EEGTokenizer
patch_duration: null
embed_dim: ${model.embed_dim}
channel_fusion: concat
# Config-only helper (not an EEGTokenizer ctor arg):
# channel_emb_dim = int(embed_dim * channel_emb_fraction).
# Default 1/4 preserves the historical 256 → 64 split.
channel_emb_fraction: 1/4
channel_emb_dim: ${eval:'int(${model.embed_dim} * (${model.tokenizer.channel_emb_fraction}))'}
channel_strategy:
  _target_: foundry.models.embeddings.PerChannelStrategy
  max_channels: ${hyperparameters.num_channels}
temporal_embedding:
  _target_: foundry.models.embeddings.ResampleCNNEmbedding
  embed_dim: ${eval:'${model.embed_dim} - ${model.tokenizer.channel_emb_dim}'}
  num_sources: 1
  target_token_rate: 100.0
  # num_filters=12 parameter-matches the per-channel CWT's ~4.9k params
  # (num_sources=1, 9 freqs, embed_dim=256).
  num_filters: 12
  kernel_size: 9
  num_conv_layers: 2
  activation: "gelu"

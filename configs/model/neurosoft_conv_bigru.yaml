_target_: foundry.models.NeurosoftConvBiGRU

# Required: exact canonical recording IDs and their physical supported-channel
# counts. Experiment configs must override this mapping from their manifest.
session_configs: ${hyperparameters.session_configs}
num_samples: 1000
adapter_dim: 64
temporal_channels: 128
temporal_kernel_samples: 64
temporal_stride: 4
conv_depth: 1
dropout_rate: 0.3
# PyTorch's default nn.Linear initializer, deterministic under the run seed.
adapter_initializer: pytorch_default
gru_hidden_size: 128
gru_num_layers: 2
gru_bidirectional: true
gru_dropout: 0.0

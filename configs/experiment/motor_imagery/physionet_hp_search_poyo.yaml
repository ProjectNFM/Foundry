# @package _global_
#
# HP search for POYO CWT-CNN (dynamic ch. emb) on PhysioNet Motor Imagery.
#
# Sweeps learning rate, batch size, and embed_dim.
# Batch size reduced from 32 to 8/16 to avoid OOM with 64 channels.
# Single fold (fold 0) — best config to be re-run on all 3 folds.
#
# Launch all 24 jobs on SLURM (3 lr × 2 batch_size × 2 class_weights.mode × 2 embed_dim):
#   uv run python main.py experiment=motor_imagery/physionet_hp_search_poyo -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: physionet_mi/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - motor_imagery_binary

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: dynamic
  embed_dim: 256
  depth: 4

data:
  split_type: intersubject
  task_type: motor_imagery


run:
  name: physionet_mi_hp_poyo_lr${hyperparameters.learning_rate}_bs${hyperparameters.batch_size}_cw-${class_weights.mode}_dim${model.embed_dim}
  group: PHYSIONET_MI_HP_SEARCH_POYO
  tags: [motor_imagery, physionet, hp_search, poyo, cwt_cnn, dynamic]
  log_level: INFO
  project: foundry_finetuning
  compile: default

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 16
  sequence_length: 4.0
  patch_duration: null
  sampling_rate: 160
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/motor_imagery_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/motor_imagery_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/motor_imagery_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.learning_rate: 1e-3, 5e-4, 1e-4
      hyperparameters.batch_size: 8, 16
      class_weights.mode: none, auto
      model.embed_dim: 128, 256
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# EEGNet final baselines on PhysioNet Motor Imagery: best HPs × 3 folds.
#
# Uses best HPs from HP search (exp 20260731): lr=1e-4, wd=0.0, cw=none, F1=8.
# Direct comparison to POYO final baselines (physionet_poyo_baselines_3fold).
#
# Launch all 3 folds on SLURM:
#   uv run python main.py experiment=motor_imagery/eegnet_physionet_final_3fold -m

defaults:
  - override /model: eegnet
  - override /data: physionet_mi/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - motor_imagery_binary

model:
  num_samples: 640
  F1: 8
  kernel_length: 64
  dropout_rate: 0.5

data:
  split_type: intersubject
  task_type: motor_imagery


run:
  name: physionet_mi_eegnet_final_fold${hyperparameters.fold_number}
  group: PHYSIONET_MI_EEGNET_FINAL_3FOLD
  tags: [motor_imagery, eegnet, physionet, baseline, from_scratch, final]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: none

hyperparameters:
  batch_size: 64
  sequence_length: 4.0
  patch_duration: 0.1
  sampling_rate: 160
  fold_number: 0
  num_workers: 6
  learning_rate: 1e-4
  weight_decay: 0.0

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/motor_imagery_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/motor_imagery_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/motor_imagery_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "ulimit -n 65536"
      - "set -a"
      - "source .env || true"
      - "set +a"
      - "export RANK=0"

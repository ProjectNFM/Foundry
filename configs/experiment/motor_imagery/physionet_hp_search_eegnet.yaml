# @package _global_
#
# HP search for EEGNet on PhysioNet Motor Imagery.
#
# Sweeps learning rate, weight decay, and spatial filter count (F1).
# Single fold (fold 0) — best config to be re-run on all 3 folds.
#
# Launch all 36 jobs on SLURM (3 lr × 3 weight_decay × 2 class_weights.mode × 2 F1):
#   uv run python main.py experiment=motor_imagery/physionet_hp_search_eegnet -m

defaults:
  - override /model: eegnet
  - override /data: physionet_mi/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - motor_imagery_binary

model:
  num_samples: 640
  F1: 8
  kernel_length: 64
  dropout_rate: 0.5

data:
  split_type: intersubject
  task_type: motor_imagery

stage:
  skip: true

run:
  name: physionet_mi_hp_eegnet_lr${hyperparameters.learning_rate}_wd${hyperparameters.weight_decay}_cw-${class_weights.mode}_F1-${model.F1}
  group: PHYSIONET_MI_HP_SEARCH_EEGNET
  tags: [motor_imagery, physionet, hp_search, eegnet]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 4.0
  patch_duration: 0.1
  sampling_rate: 160
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/motor_imagery_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/motor_imagery_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/motor_imagery_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.learning_rate: 1e-3, 5e-4, 1e-4
      hyperparameters.weight_decay: 0.0, 0.01, 0.1
      class_weights.mode: none, auto
      model.F1: 8, 16
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment motor_imagery/physionet_hp_search_eegnet"

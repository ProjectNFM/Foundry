# @package _global_
#
# All-baselines evaluation on PhysioNet Motor Imagery.
#
# 4 POYO conditions: 2 tokenizers × 2 channel_emb_modes, all from scratch.
# Session embeddings disabled for all conditions.
# Intersubject 3-fold CV.
#
# Launch all 12 POYO jobs on SLURM (4 conditions × 3 folds):
#   uv run python main.py experiment=motor_imagery/physionet_baselines -m
#
# Local singlesess smoke test:
#   uv run python main.py experiment=motor_imagery/physionet_baselines \
#       data=physionet_mi/singlesess data.split_type=intrasession \
#       model/tokenizer=per_channel_cwt_cnn model.channel_emb_mode=disabled \
#       trainer.max_epochs=2

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: physionet_mi/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - motor_imagery_binary

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: disabled

data:
  split_type: intersubject
  task_type: motor_imagery


run:
  name: physionet_mi_${hydra:runtime.choices.model/tokenizer}_ch-${model.channel_emb_mode}_fold${hyperparameters.fold_number}
  group: PHYSIONET_MI_BASELINES
  tags: [motor_imagery, physionet, baseline, from_scratch]
  log_level: INFO
  project: foundry_finetuning
  compile: default

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 32
  sequence_length: 4.0
  patch_duration: null
  sampling_rate: 160
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/motor_imagery_binary_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/motor_imagery_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/motor_imagery_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn, per_channel_resample_cnn
      model.channel_emb_mode: disabled, dynamic
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

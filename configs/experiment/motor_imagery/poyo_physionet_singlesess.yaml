# @package _global_
#
# Intrasession overfit test on a single PhysioNet MI subject.
# Use to verify the model can memorize one subject's motor imagery data locally.
#
# Run:
#   uv run python main.py experiment=motor_imagery/poyo_physionet_singlesess

defaults:
  - override /model: poyo_eeg
  - override /data: physionet_mi/singlesess
  - override /model/tokenizer: per_channel_cwt

task_configs:
  - motor_imagery_binary

model:
  zero_output_timestamps: true
  normalize_inputs: true

data:
  split_type: intrasession
  task_type: motor_imagery

run:
  name: physionet_mi_poyo_singlesess_overfit
  group: MOTOR_IMAGERY_OVERFIT
  tags: [motor_imagery, poyo, cwt, physionet, singlesess, overfit]
  log_level: INFO
  project: foundry_finetuning
  compile: false

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 4.0
  patch_duration: null
  sampling_rate: 160
  fold_number: 0
  num_workers: 4
  num_channels: null
  session_configs: null
  learning_rate: 1e-3
  weight_decay: 0.01

trainer:
  max_epochs: 200
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/motor_imagery_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/motor_imagery_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/motor_imagery_binary_f1:.4f}"

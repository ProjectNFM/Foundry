# @package _global_
#
# Finetune a data-scaling pretrained checkpoint on Kemp Sleep 5-class staging.
# Fixed model: CWT-CNN + dynamic channel_emb (the single model used across all
# 12 data-scaling pretraining runs).
#
# Requires two overrides to identify the pretrained checkpoint:
#   run.pretrain_run_name  — e.g. pretrain_A1_klinzing_small
#   run.pretrain_group     — e.g. DATA_SCALING_VOLUME
#
# Launch (3 folds for one checkpoint):
#   uv run python main.py experiment=sleep_staging/kemp_finetune_from_data_scaling \
#     run.pretrain_run_name=pretrain_A1_klinzing_small \
#     run.pretrain_group=DATA_SCALING_VOLUME -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: kemp_sleep_edf/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - sleep_stage_5class

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: dynamic

data:
  split_type: intersubject
  task_type: sleep_stage

stage:
  skip: true

run:
  pretrain_run_name: ???
  pretrain_group: ???
  name: kemp_ft_${run.pretrain_run_name}_fold${hyperparameters.fold_number}
  group: KEMP_FT_DATA_SCALING
  tags: [sleep_staging, kemp, 30s_epoch, finetuning, pretrained, data_scaling]
  log_level: INFO
  project: foundry_finetuning
  compile: default
  pretrained_checkpoint: ${oc.env:SCRATCH}/runs/${run.pretrain_group}/${run.pretrain_run_name}/checkpoints/last.ckpt
  pretrained_transfer_mode: permissive
  freeze_pretrained: false
  resume_wandb_if_name_matches: true

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 32
  sequence_length: 30.0
  patch_duration: null
  sampling_rate: null
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "ulimit -n 65536"
      - "set -a"
      - "source .env || true"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment sleep_staging/kemp_finetune_from_data_scaling --overrides run.pretrain_run_name=_dummy run.pretrain_group=_dummy"

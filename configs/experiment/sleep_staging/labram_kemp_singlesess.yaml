# @package _global_

defaults:
  - override /model: labram_base
  - override /data: kemp_sleep_edf/singlesess

task_configs:
  - sleep_stage_5class

model:
  num_channels: 2
  num_samples: 6000      # 30s × 200 Hz (LaBraM target sampling rate)

data:
  split_type: intrasession
  task_type: sleep_stage

run:
  project: Foundry
  name: kemp_sleep_labram_singlesess
  group: LABRAM_DEBUG # SLEEP_STAGING
  tags: [sleep_staging, labram_base, kemp, singlesess]
  log_level: INFO

class_weights:
  mode: null
  smoothing: 0.1

hyperparameters:
  batch_size: 32         # Reduced from 128 due to larger model
  sequence_length: 30.0
  patch_duration: 0.1
  sampling_rate: 200     # LaBraM's target resampling rate
  fold_number: 0
  num_workers: 4
  learning_rate: 5e-5
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  devices: 1
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

# @package _global_
#
# Experiment 023: All-baselines 30s-epoch evaluation on KempSleep.
#
# 4 POYO conditions: 2 tokenizers × 2 channel_emb_modes, all from scratch.
# Session embeddings disabled for all conditions.
# Uses proper 30s sleep epochs and intersubject 3-fold CV.
#
# Launch all 12 POYO jobs on SLURM (4 conditions × 3 folds):
#   uv run python main.py experiment=sleep_staging/kemp_30s_baselines -m
#
# For the small (10% train) dataset, override data:
#   uv run python main.py experiment=sleep_staging/kemp_30s_baselines \
#       data=kemp_sleep_edf/allsess_small -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: kemp_sleep_edf/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - sleep_stage_5class

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: disabled

data:
  split_type: intersubject
  task_type: sleep_stage


run:
  name: kemp_023_${hydra:runtime.choices.model/tokenizer}_ch-${model.channel_emb_mode}_fold${hyperparameters.fold_number}
  group: KEMP_30S_BASELINES
  tags: [sleep_staging, kemp, 30s_epoch, baseline, from_scratch, exp023]
  log_level: INFO
  project: foundry_finetuning
  compile: default

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 32
  sequence_length: 30.0
  patch_duration: null
  sampling_rate: null
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn, per_channel_resample_cnn
      model.channel_emb_mode: disabled, dynamic
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

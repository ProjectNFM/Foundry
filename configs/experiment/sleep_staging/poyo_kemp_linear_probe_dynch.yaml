# @package _global_
#
# Experiment 020: Linear probing for dynamic channel embedding models (exp 018).
#
# 4 conditions: 2 channel_emb_mode × {pretrained, random-init}
#
# Launch all 4 conditions on SLURM (2 commands × 2 jobs each):
#   uv run python main.py experiment=sleep_staging/poyo_kemp_linear_probe_dynch \
#       run.init_mode=pretrained -m
#   uv run python main.py experiment=sleep_staging/poyo_kemp_linear_probe_dynch \
#       run.init_mode=random run.pretrained_checkpoint=null -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_resample_cnn
  - override /model/session_emb: disabled
  - override /data: kemp_sleep_edf/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - sleep_stage_5class

pretrained_checkpoints:
  disabled: /network/scratch/s/sobralm/runs/PRETRAIN_DYNAMIC_CHANNEL_EMB/pretrain_dynch_ch-disabled/checkpoints/last.ckpt
  dynamic: /network/scratch/s/sobralm/runs/PRETRAIN_DYNAMIC_CHANNEL_EMB/pretrain_dynch_ch-dynamic/checkpoints/last.ckpt

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: disabled

data:
  split_type: intersubject
  task_type: sleep_stage


run:
  name: kemp_lp_020_${run.init_mode}_ch_${model.channel_emb_mode}
  group: KEMP_LINEAR_PROBE_DYNCH
  tags: [sleep_staging, poyo, kemp, linear_probe, exp020]
  log_level: INFO
  project: foundry_finetuning
  compile: default
  pretrained_checkpoint: ${pretrained_checkpoints.${model.channel_emb_mode}}
  pretrained_transfer_mode: permissive
  freeze_pretrained: true
  freeze_backbone: true
  init_mode: pretrained

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 512
  sequence_length: 2.0
  patch_duration: null
  sampling_rate: null
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-3
  weight_decay: 0.01

trainer:
  max_epochs: 100
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 10
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

hydra:
  sweeper:
    params:
      model.channel_emb_mode: disabled, dynamic
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

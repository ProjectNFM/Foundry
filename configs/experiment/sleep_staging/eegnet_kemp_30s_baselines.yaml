# @package _global_
#
# Experiment 023: EEGNet 30s-epoch baseline on KempSleep.
#
# Intersubject 3-fold CV with proper 30s sleep epochs.
#
# Launch all 3 folds on SLURM:
#   uv run python main.py experiment=sleep_staging/eegnet_kemp_30s_baselines -m
#
# For the small (10% train) dataset, override data:
#   uv run python main.py experiment=sleep_staging/eegnet_kemp_30s_baselines \
#       data=kemp_sleep_edf/allsess_small -m

defaults:
  - override /model: eegnet
  - override /data: kemp_sleep_edf/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - sleep_stage_5class

model:
  num_channels: 2
  num_samples: 3000

data:
  split_type: intersubject
  task_type: sleep_stage

stage:
  skip: true

run:
  name: kemp_023_eegnet_fold${hyperparameters.fold_number}
  group: KEMP_30S_BASELINES
  tags: [sleep_staging, eegnet, kemp, 30s_epoch, baseline, from_scratch, exp023]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 0.1

hyperparameters:
  batch_size: 64
  sequence_length: 30.0
  patch_duration: 0.1
  sampling_rate: 100
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment sleep_staging/eegnet_kemp_30s_baselines"

# @package _global_
#
# Experiment 022: KempSleep baselines (scratch) and finetuning from pretrained
# models with dynamic/disabled channel embeddings × CWT-CNN/ResampleCNN.
# Session embeddings disabled for all conditions.
#
# 8 conditions: 2 tokenizers × 2 channel_emb_mode × {scratch, finetuned}
#
# Scratch baselines (4 jobs):
#   uv run python main.py experiment=sleep_staging/poyo_kemp_finetune_cwt_dynch \
#       run.init_mode=scratch run.pretrained_checkpoint=null -m
#
# Finetuning from pretrained checkpoints (4 jobs):
#   uv run python main.py experiment=sleep_staging/poyo_kemp_finetune_cwt_dynch \
#       run.init_mode=finetuned -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: kemp_sleep_edf/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - sleep_stage_5class

# Checkpoint map: tokenizer → channel_emb_mode → checkpoint path
# CWT-CNN checkpoints from exp 021; ResampleCNN checkpoints from exp 018
pretrained_checkpoints:
  per_channel_cwt_cnn:
    disabled: /network/scratch/s/sobralm/runs/PRETRAIN_CWT_DYNAMIC_CHANNEL_EMB/pretrain_cwt_dynch_ch-disabled/checkpoints/last.ckpt
    dynamic: /network/scratch/s/sobralm/runs/PRETRAIN_CWT_DYNAMIC_CHANNEL_EMB/pretrain_cwt_dynch_ch-dynamic/checkpoints/last.ckpt
  per_channel_resample_cnn:
    disabled: /network/scratch/s/sobralm/runs/PRETRAIN_DYNAMIC_CHANNEL_EMB/pretrain_dynch_ch-disabled/checkpoints/last.ckpt
    dynamic: /network/scratch/s/sobralm/runs/PRETRAIN_DYNAMIC_CHANNEL_EMB/pretrain_dynch_ch-dynamic/checkpoints/last.ckpt

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: disabled

data:
  split_type: intersubject
  task_type: sleep_stage


run:
  name: kemp_022_${run.init_mode}_${hydra:runtime.choices.model/tokenizer}_ch_${model.channel_emb_mode}
  group: KEMP_FINETUNE_CWT_DYNCH
  tags: [sleep_staging, poyo, kemp, dynamic_channel_emb, exp022]
  log_level: INFO
  project: foundry_finetuning
  compile: default
  pretrained_checkpoint: ${pretrained_checkpoints.${hydra:runtime.choices.model/tokenizer}.${model.channel_emb_mode}}
  pretrained_transfer_mode: permissive
  freeze_pretrained: false
  init_mode: finetuned

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 512
  sequence_length: 2.0
  patch_duration: null
  sampling_rate: null
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/sleep_stage_5class_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/sleep_stage_5class_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/sleep_stage_5class_f1:.4f}"

hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn, per_channel_resample_cnn
      model.channel_emb_mode: disabled, dynamic
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

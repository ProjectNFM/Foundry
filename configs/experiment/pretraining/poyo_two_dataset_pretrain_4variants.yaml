# @package _global_
#
# Two-dataset MAE pretraining: Klinzing sleep + Shirazi HBN resting-state.
# 4 conditions: 2 tokenizers (CWT-CNN, ResampleCNN) × 2 channel_emb_modes
# (disabled, dynamic), all with session_emb=disabled.
#
# Local dry-run (single condition):
#   uv run python main.py experiment=pretraining/poyo_two_dataset_pretrain_4variants \
#     model/tokenizer=per_channel_cwt_cnn model.channel_emb_mode=disabled
#
# SLURM sweep (4 conditions):
#   uv run python main.py experiment=pretraining/poyo_two_dataset_pretrain_4variants -m

defaults:
  - override /model: masked_poyo_eeg
  - override /model/session_emb: disabled
  - override /data: openneuro/two_dataset_pretrain
  - override /hydra/launcher: slurm_default

task_configs:
  - masked_reconstruction

model:
  zero_output_timestamps: false
  normalize_inputs: true
  channel_emb_mode: disabled
  masking:
    _target_: foundry.tasks.masking.TemporalBlockMasking
    block_size: 10
    mask_ratio: 0.5

data:
  split_type: intrasession
  task_type: null

run:
  name: pretrain_2ds_${hydra:runtime.choices.model/tokenizer}_ch-${model.channel_emb_mode}
  project: foundry_pretraining
  group: PRETRAIN_TWO_DATASET_4VARIANTS
  tags: [pretraining, mae, masked, two_dataset, klinzing, shirazi]
  log_level: INFO
  compile: default

hyperparameters:
  batch_size: 64
  sequence_length: 2.0
  patch_duration: null
  sampling_rate: null
  num_channels: null
  fold_number: 0
  num_workers: 6
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 200
  precision: bf16-mixed
  callbacks:
    model_checkpoint:
      monitor: val/loss
      mode: min
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_loss_{val/loss:.4f}"


hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn, per_channel_resample_cnn
      model.channel_emb_mode: disabled, dynamic
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 2880
    max_num_timeout: 5
    setup:
      - "ulimit -n 65536"
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

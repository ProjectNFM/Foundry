# @package _global_
#
# Base config for the 12-run data scaling experiment.
# Fixed model: CWT-CNN tokenizer, dynamic channel embeddings, disabled session
# embeddings, TemporalBlockMasking.  Fixed compute budget: 200,000 optimizer
# steps with warmup + cosine decay LR schedule (step-level).
#
# Each experiment file (volume scaling, diversity scaling, etc.) inherits this
# base and overrides only `data`, `run.name`, and `run.group`.
#
# Local test (override data to any scaling config):
#   uv run python main.py experiment=pretraining/poyo_data_scaling_base \
#     data=openneuro/sleep_brainset +trainer.limit_train_batches=5
#
# SLURM (override data in experiment-specific config):
#   uv run python main.py experiment=pretraining/poyo_data_scaling_base \
#     data=openneuro/all_datasets

defaults:
  - override /model: masked_poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /hydra/launcher: slurm_default

task_configs:
  - masked_reconstruction

model:
  zero_output_timestamps: false
  normalize_inputs: true
  channel_emb_mode: dynamic
  masking:
    _target_: foundry.tasks.masking.TemporalBlockMasking
    block_size: 10
    mask_ratio: 0.5

data:
  root: ${oc.env:SLURM_TMPDIR}/brainsets/processed
  split_type: intrasession
  task_type: null

run:
  name: data_scaling_base
  project: foundry_pretraining
  group: DATA_SCALING
  tags: [pretraining, mae, masked, data_scaling, cwt_cnn, dynamic_ch]
  log_level: INFO
  compile: default
  resume_wandb_if_name_matches: true

hyperparameters:
  batch_size: 64
  sequence_length: 2.0
  patch_duration: null
  sampling_rate: null
  num_channels: null
  fold_number: 0
  num_workers: 12
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup: 2000
  decay: 198000
  scheduler_interval: step

trainer:
  max_steps: 200000
  max_epochs: -1
  precision: bf16-mixed
  val_check_interval: 5000
  callbacks:
    early_stopping:
      patience: 20
    model_checkpoint:
      monitor: val/loss
      mode: min
      auto_insert_metric_name: false
      filename: "best-step{step:06d}-val_loss_{val/loss:.4f}"
    reconstruction_visualization:
      log_every_n_steps: 1000
    embedding_visualization:
      every_n_epochs: 1

stage:
  skip: false

hydra:
  launcher:
    tasks_per_node: 1
    cpus_per_task: 12
    mem_gb: 128
    gres: gpu:l40s:1
    timeout_min: 2880
    max_num_timeout: 5
    setup:
      - "ulimit -n 65536"
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# NeuralBench P3 / Korczowski2014A — Foundry EEGNet matched to braindecode.
#
# Closes the implementation gap identified in the comparison audit by
# matching dropout (0.25), BatchNorm params, spatial max_norm, and OneCycleLR.
#
# Run locally:
#   uv run python main.py experiment=neuralbench/p300_eegnet_matched seed=33

defaults:
  - override /model: eegnet
  - override /module: default
  - override /hydra/launcher: slurm_default

task_configs:
  - neuralbench/p300

data:
  _target_: foundry.data.neuralbench.datamodule.NeuralBenchDataModule
  task: p3
  dataset: korczowski2014a
  cache_dir: ${oc.env:NEURALSET_CACHE_DIR,/network/scratch/s/sobralm/neuralset-data}
  batch_size: 64
  num_workers: ${hyperparameters.num_workers}
  pin_memory: true

model:
  num_samples: 120
  kernel_length: 64
  F1: 8
  D: 2
  F2: 16
  dropout_rate: 0.25
  bn_momentum: 0.01
  bn_eps: 1e-3
  spatial_max_norm: 1.0

class_weights:
  mode: auto
  smoothing: 1.0

run:
  name: nb_p300_eegnet_matched_seed${seed}
  evaluate_test: true
  float32_matmul_precision: highest
  group: NB_P300_EEGNET_MATCHED
  tags: [neuralbench, p300, eegnet, matched, poc_phase2]
  log_level: INFO
  project: foundry-neuralbench
  seed: ${seed}

seed: 33

# Mirrors NeuralBench's AdamW + OneCycleLR recipe as well as its EEGNet
# hyperparameters. The remaining difference is the Foundry ReadoutRouter
# versus braindecode's single linear classifier implementation.
hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 120
  fold_number: 0
  num_channels: 16
  num_workers: 10
  learning_rate: 1e-4
  weight_decay: 0.05
  scheduler_name: onecycle
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: "constant"
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: "step"
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

trainer:
  max_epochs: 40
  precision: 32-true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      patience: 10
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_balanced_acc_{val/neuralbench_p300_balanced_acc:.4f}"
      save_last: true

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-neuralbench
  name: ${run.name}
  tags: ${run.tags}
  save_dir: .

hydra:
  sweeper:
    params:
      seed: 33, 34, 35
  launcher:
    tasks_per_node: 1
    cpus_per_task: 10
    mem_gb: 64
    gres: gpu:l40s:1
    timeout_min: 360
    partition: long
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# NeuralBench P300 / Korczowski2014A — from-scratch POYO tokenizer baseline.
# Matches p300_eegnet_matched's data, subject split, optimizer, schedule, and
# evaluation protocol; only the POYO model and temporal tokenizer vary.

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: static
  - override /module: default
  - override /hydra/launcher: slurm_default

task_configs:
  - neuralbench/p300

data:
  _target_: foundry.data.neuralbench.datamodule.NeuralBenchDataModule
  task: p3
  dataset: korczowski2014a
  cache_dir: ${oc.env:NEURALSET_CACHE_DIR,/network/scratch/s/sobralm/neuralset-data}
  batch_size: 64
  num_workers: ${hyperparameters.num_workers}
  pin_memory: true

model:
  embed_dim: 256
  depth: 4
  channel_emb_mode: static

class_weights:
  mode: auto
  smoothing: 1.0

run:
  name: nb_p300_poyo_${hydra:runtime.choices.model/tokenizer}_seed${seed}
  evaluate_test: true
  float32_matmul_precision: highest
  group: NB_P300_POYO_TOKENIZER_BASELINES
  tags: [neuralbench, p300, poyo, tokenizer, baseline, from_scratch]
  log_level: INFO
  project: foundry-neuralbench
  seed: ${seed}

seed: 33

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 120
  fold_number: 0
  num_channels: 16
  num_workers: 6
  learning_rate: 1e-4
  weight_decay: 0.05
  scheduler_name: onecycle
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: constant
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: step
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

trainer:
  max_epochs: 40
  precision: 32-true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      patience: 10
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_balanced_acc_{val/neuralbench_p300_balanced_acc:.4f}"
      save_last: true

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-neuralbench
  name: ${run.name}
  tags: ${run.tags}
  save_dir: .

hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn,per_channel_resample_cnn
      seed: 33,34,35
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 64
    gres: gpu:rtx8000:1
    timeout_min: 360
    partition: long
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# Local, single-seed, full-data validation-only test of whether correctly
# bound electrode position in the channel value stream makes MI learnable.

defaults:
  - /hero_position_value_condition: anonymous
  - override /model: hero
  - override /module: default
  - override /hydra/launcher: local_gpu

task_configs:
  - neuralbench/motor_imagery

data:
  _target_: foundry.data.neuralbench.datamodule.NeuralBenchDataModule
  task: motor_imagery
  dataset: schalk2004bci2000
  cache_dir: ${oc.env:NEURALSET_CACHE_DIR,/network/scratch/s/sobralm/neuralset-data}
  batch_size: 64
  num_workers: ${hyperparameters.num_workers}
  pin_memory: true
  interval_name: motor_imagery_trials
  label_attr: targets
  session_prefix: nb/motor_imagery
  train_subset_size: null
  val_subset_size: null
  subset_seed: ${seed}

model:
  temporal_mode: flat
  num_spatial_slots: 8

class_weights:
  mode: auto
  smoothing: 1.0

run:
  name: nb_mi_hero_position_value_pilot_${condition_name}_seed${seed}
  evaluate_test: false
  float32_matmul_precision: highest
  compile: default
  group: NB_MI_HERO_POSITION_VALUE_PILOT
  tags: [neuralbench, motor_imagery, hero, position_value, pilot, validation_only, "${condition_name}", from_scratch]
  log_level: INFO
  project: foundry-neuralbench
  seed: ${seed}

seed: 33

hyperparameters:
  batch_size: 64
  sequence_length: 4.0
  patch_duration: 0.1
  sampling_rate: 120
  fold_number: 0
  num_channels: 64
  num_workers: 4
  learning_rate: 1e-4
  weight_decay: 0.05
  scheduler_name: onecycle
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: constant
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: step
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

trainer:
  max_epochs: 40
  precision: 16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/neuralbench_motor_imagery_balanced_acc
      mode: max
      patience: 10
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/neuralbench_motor_imagery_balanced_acc
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_balanced_acc_{val/neuralbench_motor_imagery_balanced_acc:.4f}"
      save_last: true

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-neuralbench
  name: ${run.name}
  tags: ${run.tags}
  save_dir: .

hydra:
  sweeper:
    # Exactly one two-condition comparison, both on seed 33.
    params:
      hero_position_value_condition: anonymous,position_values
      seed: 33
  launcher:
    stop_on_failure: true

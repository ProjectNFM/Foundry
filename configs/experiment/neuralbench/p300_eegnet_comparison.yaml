# @package _global_
#
# NeuralBench P3 / Korczowski2014A — Foundry EEGNet validation comparison.
#
# POC Phase 2, Step 1: mirrors every NeuralBench setting that affects validation.
# This is an *implementation comparison*, not a replication — architectural
# differences between Foundry EEGNet and braindecode EEGNet are documented in
# docs/neuralbench-eegnet-comparison.md.
#
# Launch on SLURM (3-seed protocol matching NeuralBench grid):
#   uv run python main.py experiment=neuralbench/p300_eegnet_comparison -m
#
# Local smoke test (single seed, quick):
#   uv run python main.py experiment=neuralbench/p300_eegnet_comparison \
#       hydra/launcher=local_gpu trainer.max_epochs=2 \
#       trainer.limit_train_batches=10 trainer.limit_val_batches=10

defaults:
  - override /model: eegnet
  - override /module: default
  - override /hydra/launcher: slurm_default

task_configs:
  - neuralbench/p300

data:
  _target_: foundry.data.neuralbench.datamodule.NeuralBenchDataModule
  task: p3
  dataset: korczowski2014a
  cache_dir: ${oc.env:NEURALSET_CACHE_DIR,/network/scratch/s/sobralm/neuralset-data}
  batch_size: 64
  num_workers: ${hyperparameters.num_workers}
  pin_memory: false
  label_map:
    0: NonTarget
    1: Target

model:
  num_samples: 120
  kernel_length: 64
  F1: 8
  D: 2
  F2: 16
  dropout_rate: 0.5

class_weights:
  mode: auto
  smoothing: 1.0

run:
  name: nb_p300_eegnet_seed${seed}
  evaluate_test: true
  group: NB_P300_EEGNET_COMPARISON
  tags: [neuralbench, p300, eegnet, comparison, poc_phase2]
  log_level: INFO
  project: foundry-neuralbench
  seed: ${seed}

seed: 33

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 120
  fold_number: 0
  num_channels: 16
  num_workers: 4
  learning_rate: 1e-4
  weight_decay: 0.05
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: "constant"
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: "step"
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

trainer:
  max_epochs: 40
  precision: 32-true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      patience: 10
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/neuralbench_p300_balanced_acc
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_balanced_acc_{val/neuralbench_p300_balanced_acc:.4f}"
      save_last: true

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-neuralbench
  name: ${run.name}
  tags: ${run.tags}
  save_dir: .

hydra:
  sweeper:
    params:
      seed: 33, 34, 35
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:1
    timeout_min: 360
    partition: long
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

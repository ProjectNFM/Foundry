# @package _global_
#
# NeuralBench Motor Imagery / Schalk2004Bci2000 (PhysioNet) — Foundry EEGNet comparison.
#
# Phase 1: single-seed EEGNet validation comparison for Motor Imagery.
# 4-class MI (both fists, both feet, left fist, right fist), 4s epochs @ 120 Hz.
#
# Launch on SLURM:
#   uv run python main.py experiment=neuralbench/mi_eegnet_comparison
#
# Local smoke test:
#   uv run python main.py experiment=neuralbench/mi_eegnet_comparison \
#       hydra/launcher=local_gpu trainer.max_epochs=2 \
#       trainer.limit_train_batches=10 trainer.limit_val_batches=10

defaults:
  - override /model: eegnet
  - override /module: default
  - override /hydra/launcher: slurm_default

task_configs:
  - neuralbench/motor_imagery

data:
  _target_: foundry.data.neuralbench.datamodule.NeuralBenchDataModule
  task: motor_imagery
  dataset: schalk2004bci2000
  cache_dir: ${oc.env:NEURALSET_CACHE_DIR,/network/scratch/s/sobralm/neuralset-data}
  batch_size: 64
  num_workers: ${hyperparameters.num_workers}
  pin_memory: false
  interval_name: motor_imagery_trials
  label_attr: targets
  session_prefix: nb/motor_imagery

model:
  num_samples: 480
  kernel_length: 64
  F1: 8
  D: 2
  F2: 16
  dropout_rate: 0.5

class_weights:
  mode: auto
  smoothing: 1.0

run:
  name: nb_mi_eegnet_seed${seed}
  evaluate_test: true
  group: NB_MI_EEGNET_COMPARISON
  tags: [neuralbench, motor_imagery, eegnet, comparison, phase1]
  log_level: INFO
  project: foundry-neuralbench
  seed: ${seed}

seed: 33

hyperparameters:
  batch_size: 64
  sequence_length: 4.0
  patch_duration: 0.1
  sampling_rate: 120
  fold_number: 0
  num_workers: 4
  learning_rate: 1e-4
  weight_decay: 0.05
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: "constant"
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: "step"
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

trainer:
  max_epochs: 40
  precision: 32-true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/neuralbench_motor_imagery_balanced_acc
      mode: max
      patience: 5
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/neuralbench_motor_imagery_balanced_acc
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_balanced_acc_{val/neuralbench_motor_imagery_balanced_acc:.4f}"
      save_last: true

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: foundry-neuralbench
  name: ${run.name}
  tags: ${run.tags}
  save_dir: .

hydra:
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:1
    timeout_min: 360
    partition: long
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# Test the focal loss implementation.
#

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_resample_cnn
  - override /data: neurosoft_monkeys/multisess_raw
  - override /cluster: cscs

task_configs:
  - neurosoft_acoustic_stim_8band_focal_loss

model:
  zero_output_timestamps: true
  normalize_inputs: false

data:
  split_type: intrasession-block
  task_type: acoustic_stim

run:
  project: auditory_decoding
  name: ${hydra:runtime.choices.model}_neurosoft_8band
  group: NEUROSOFT_INTRASESSION_MULTISUBJ
  tags:
    - neurosoft
    - ${hydra:runtime.choices.model}
    - training
    - 8band
    - monkeys
    - focal_loss+opt_capacity
  seed: 42
  log_level: INFO

hyperparameters:
  batch_size: 128
  sequence_length: 0.5
  patch_duration: 0.1
  fold_number: 0
  num_workers: 4
  sampling_rate: 2000
  learning_rate: 2.75e-5
  weight_decay: 0.08

trainer:
  gradient_clip_algorithm: norm
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      patience: 50
      # Fail loudly if the monitored metric is missing (e.g. task name mismatch).
      strict: true
    model_checkpoint:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/neurosoft_acoustic_stim_8band_f1:.4f}"

stage:
  skip: true
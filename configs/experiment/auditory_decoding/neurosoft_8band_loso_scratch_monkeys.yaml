# @package _global_
# Validation-only LOSO baseline for NeuroSoft monkeys.

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: neurosoft_monkeys/multisess_raw
  - override /hydra/launcher: slurm_default

task_configs:
  - neurosoft_acoustic_stim_8band

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: dynamic

data:
  root: ${oc.env:SCRATCH}/brainsets/processed
  sequence_length: 0.5
  split_type: loso
  # Provides a resolvable base run name while the multirun sweeper below
  # replaces it with every eligible held-out subject.
  held_out_subject: sub-01
  task_type: acoustic_stim

stage:
  skip: true

run:
  project: auditory_decoding
  name: neurosoft_8b_loso_scratch_monkeys_${data.held_out_subject}
  group: NEUROSOFT_8B_LOSO_SCRATCH_BASELINES
  tags: [neurosoft, 8band, loso, scratch, monkeys, cwt_cnn, validation_only]
  seed: 42
  log_level: INFO
  pretrained_checkpoint: null

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 128
  sequence_length: 2.0
  patch_duration: null
  # Required by the dynamic per-channel tokenizer.  ``null`` retains the
  # variable-channel behavior used during leak-fixed pretraining.
  num_channels: null
  sampling_rate: 100
  fold_number: 0
  num_workers: 4
  learning_rate: 2.5e-5
  weight_decay: 0.30

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  callbacks:
    early_stopping:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      auto_insert_metric_name: false
      filename: best-epoch{epoch:03d}-val_f1_{val/neurosoft_acoustic_stim_8band_f1:.4f}

hydra:
  sweeper:
    params:
      data.held_out_subject: sub-01, sub-02, sub-03, sub-04, sub-05, sub-06
  launcher:
    timeout_min: 720
    cpus_per_task: 4
    mem_gb: 64
    gres: gpu:l40s:1

# @package _global_
#
# EEGNet baseline on a single NeuroSoft minipig session for 8-band acoustic
# stimulus decoding.
#
# Usage:
#   uv run python main.py experiment=auditory_decoding/eegnet_neurosoft_8band_singlesess

defaults:
  - override /model: eegnet
  - override /data: neurosoft_minipigs/multisess_raw
  - override /model/channel_strategy: session

task_configs:
  - neurosoft_acoustic_stim_8band

model:
  # Session projection maps variable electrode counts to num_sources, which
  # is the channel axis GRU's input_projactually sees.
  num_channels: ${hyperparameters.num_sources}
  num_samples: 1000

data:
  split_type: intrasession-block
  task_type: acoustic_stim

run:
  project: suarez_auditory_decoding
  name: ${hydra:runtime.choices.model}_neurosoft_8band_F1-${model.F1}_k${model.kernel_length}_D${model.D}_ns${hyperparameters.num_sources}
  group: HYPER-PARAM-SEARCH
  tags:
    - baselines
    - ${hydra:runtime.choices.model}
    - training
    - 8band
    - minipigs
    - intrasession-multisubject
  seed: 42
  log_level: INFO

hyperparameters:
  batch_size: 16
  sequence_length: 0.5
  fold_number: 0
  num_workers: 4
  learning_rate: 0.015
  weight_decay: 0.018
  num_channels: null
  num_sources: 64
  session_configs: null

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/neurosoft_acoustic_stim_8band_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/neurosoft_acoustic_stim_8band_f1:.4f}"

stage:
  mode: direct

hydra:
  sweeper:
    max_batch_size: 1000
    params:
      data.dataset_kwargs.recording_ids: ${config_list_sweep_choices:configs/data/neurosoft_minipigs/multisess_raw.yaml,dataset_kwargs.recording_ids}
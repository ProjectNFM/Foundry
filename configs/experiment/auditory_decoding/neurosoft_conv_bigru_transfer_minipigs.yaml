# @package _global_
# NeuroSoft Phase 3 transfer evaluation for minipigs.

defaults:
  - override /model: neurosoft_conv_bigru
  - override /data: neurosoft_minipigs/singlesess
  - override /logger: wandb

task_configs: [neurosoft_acoustic_stim_8band]

model:
  num_samples: 1000

data:
  root: ${oc.env:FOUNDRY_DATA_ROOT,./data/processed/}
  split_type: intrasession-causal
  audit_json: docs/neurosoft-phase0-audit.json
  audit_species: minipigs
  task_type: acoustic_stim
  training_fraction_task: neurosoft_acoustic_stim_8band
  training_fraction: 1.0
  training_fraction_seed: ${run.seed}
  training_fraction_min_class_support: 3
  training_fraction_min_present_classes: 6
  input_normalization:
    mode: recording_train_global_zscore
    supported_modalities: [eeg, ecog, seeg, ieeg]
    scale_floor: 1.0e-8
    accumulator_dtype: float64
  dataset_kwargs:
    recording_ids:
      - ???

class_weights:
  mode: none

run:
  project: neurosoft_supervised_pretraining
  name: ${run.cell_id}
  group: NEUROSOFT_TRANSFER_MINIPIGS
  tags: [transfer, minipigs, 8band, phase3]
  seed: 42
  resume_wandb_if_name_matches: true
  unsupported_bf16_fallback: 16-mixed
  log_level: INFO
  evaluate_test: false
  pretrained_checkpoint: null
  # Source-free cells (including frozen_random_control) deliberately leave
  # this unset; manifest-backed regimes override it per compiled cell.
  pretrained_checkpoint_manifest: null
  pretrained_checkpoint_manifest_hash: null
  pretrained_checkpoint_sha256: null
  pretrained_transfer_regime: null
  cell_id: uncompiled_minipig_transfer
  checkpoint_set_id: null
  checkpoint_id: null
  source_selection_seed: null
  source_model_seed: null
  source_condition: null
  condition_labels: {}
  target_species: minipigs
  target_subject: null

hyperparameters:
  batch_size: 16
  sequence_length: 0.5
  fold_number: 0
  num_workers: 1
  num_channels: null
  session_configs: null
  # Must remain matched to the Phase-2 scratch control recipe. Source
  # pretraining has an independent optimizer recipe.
  learning_rate: 0.0015
  weight_decay: 0.018

stage:
  mode: direct

trainer:
  max_epochs: 200
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  callbacks:
    learning_rate_monitor:
      logging_interval: epoch
    early_stopping:
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      patience: 40
    model_checkpoint:
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      auto_insert_metric_name: false
    compute_tracking:
      _target_: foundry.training.callbacks.ComputeTrackingCallback
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      sequence_length: ${hyperparameters.sequence_length}
      require_flops: true
      flops_per_window: 768098304
      flop_method: torch-flop-counter-v1

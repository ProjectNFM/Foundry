# @package _global_
#
# Phase 1 RETRY: EEGNet learning curves — minipig cells that failed/timed out.
# 25 cells × 3 seeds = 75 tasks. Some seeds already finished in the initial
# launch and will be deduplicated during analysis.
#
# Usage:
#   python main.py experiment=auditory_decoding/eegnet_neurosoft_8band_learning_curves_minipigs_retry hydra/launcher=slurm_default -m

defaults:
  - override /model: eegnet
  - override /data: neurosoft_minipigs/singlesess

task_configs:
  - neurosoft_acoustic_stim_8band

phase1_cell: ???

model:
  num_channels: ${get_num_ecog_channels_by_name:${data.root}/neurosoft_minipigs_2026,${data.dataset_kwargs.recording_ids.0}}
  num_samples: 1000

data:
  split_type: intrasession-causal
  audit_json: docs/neurosoft-phase0-audit.json
  audit_species: minipigs
  task_type: acoustic_stim
  training_fraction_task: neurosoft_acoustic_stim_8band
  training_fraction: ${phase1_cell_fraction:${phase1_cell}}
  training_fraction_seed: ${run.seed}
  training_fraction_min_class_support: 3
  training_fraction_min_present_classes: 6
  dataset_kwargs:
    recording_ids:
      - ${phase1_cell_recording:${phase1_cell}}

run:
  project: neurosoft_supervised_pretraining
  name: eegnet_mp_${data.dataset_kwargs.recording_ids.0}_f${data.training_fraction}_s${run.seed}
  group: PHASE1_EEGNET_MINIPIGS
  tags: [phase1, eegnet, minipigs, 8band, learning-curves, retry]
  seed: ???
  log_level: INFO
  evaluate_test: true

hyperparameters:
  batch_size: 16
  sequence_length: 0.5
  fold_number: 0
  num_workers: 1
  learning_rate: 0.015
  weight_decay: 0.018

trainer:
  max_epochs: 200
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      patience: 40
    model_checkpoint:
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      auto_insert_metric_name: false
    compute_tracking:
      _target_: foundry.training.callbacks.ComputeTrackingCallback
      monitor: val/neurosoft_acoustic_stim_8band_supported_f1
      mode: max
      sequence_length: ${hyperparameters.sequence_length}
      require_flops: true
      flops_per_window: 78487808
      flop_method: torch-flop-counter-v1

hydra:
  sweeper:
    max_batch_size: 1000
    params:
      phase1_cell: >-
        'sub-01_ses-02_task-AcousStim_acq-LH_desc-raw|1.00',
        'sub-02_ses-02_task-AcousStim_acq-LH_desc-raw|1.00',
        'sub-02_ses-02_task-AcousStim_acq-RH_desc-raw|0.05',
        'sub-02_ses-02_task-AcousStim_acq-RH_desc-raw|0.25',
        'sub-02_ses-02_task-AcousStim_acq-RH_desc-raw|0.50',
        'sub-02_ses-02_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-03_ses-01_task-AcousStim_acq-LH_desc-raw|1.00',
        'sub-03_ses-01_task-AcousStim_acq-RH_desc-raw|0.50',
        'sub-03_ses-01_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-03_ses-03_task-AcousStim_acq-LHanest_desc-raw|0.25',
        'sub-03_ses-03_task-AcousStim_acq-LHanest_desc-raw|0.50',
        'sub-03_ses-03_task-AcousStim_acq-LHanest_desc-raw|1.00',
        'sub-03_ses-03_task-AcousStim_acq-RHanest_desc-raw|0.50',
        'sub-03_ses-03_task-AcousStim_acq-RHanest_desc-raw|1.00',
        'sub-03_ses-04_task-AcousStim_acq-LHanest_desc-raw|0.50',
        'sub-03_ses-04_task-AcousStim_acq-RHanest_desc-raw|1.00',
        'sub-03_ses-06_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-03_ses-07_task-AcousStim_acq-RHanest_desc-raw|0.25',
        'sub-03_ses-07_task-AcousStim_acq-RHanest_desc-raw|0.50',
        'sub-03_ses-07_task-AcousStim_acq-RHanest_desc-raw|1.00',
        'sub-05_ses-02_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-06_ses-02_task-AcousStim_acq-LH_desc-raw|1.00',
        'sub-06_ses-02_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-07_ses-02_task-AcousStim_acq-RH_desc-raw|1.00',
        'sub-07_ses-05_task-AcousStim_acq-LH_desc-raw|0.50'
      run.seed: 42,43,44
  launcher:
    partition: long
    gres: gpu:rtx8000:1
    mem_gb: 47
    timeout_min: 60
    tasks_per_node: 2

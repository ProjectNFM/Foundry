# @package _global_
# Override auxiliary_band or sweep all eight class names with Hydra -m.

defaults:
  - /experiment/auditory_decoding/poyo_neurosoft_freqband8_joint_causal
  - _self_

auxiliary_band: high_treble

data:
  train_band_ids_by_source:
    monkeys:
      - ${auxiliary_band}

run:
  name: poyo_neurosoft_freqband8_minipigs_plus_monkeys_${auxiliary_band}_causal
  tags:
    - neurosoft
    - target_minipigs
    - auxiliary_monkeys
    - auxiliary_${auxiliary_band}
    - one_band_control
    - causal

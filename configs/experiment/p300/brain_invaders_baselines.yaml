# @package _global_
#
# All-baselines evaluation on Brain Invaders P300.
#
# 4 POYO conditions: 2 tokenizers × 2 channel_emb_modes, all from scratch.
# Session embeddings disabled for all conditions.
# Intersubject 3-fold CV.
#
# Launch all 12 POYO jobs on SLURM (4 conditions × 3 folds):
#   uv run python main.py experiment=p300/brain_invaders_baselines -m
#
# Local singlesess smoke test:
#   uv run python main.py experiment=p300/brain_invaders_baselines \
#       data=brain_invaders_p300/singlesess data.split_type=intrasession \
#       model/tokenizer=per_channel_cwt_cnn model.channel_emb_mode=disabled \
#       trainer.max_epochs=2

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: disabled

data:
  split_type: intersubject
  task_type: p300

stage:
  skip: true

run:
  name: bi_p300_${hydra:runtime.choices.model/tokenizer}_ch-${model.channel_emb_mode}_fold${hyperparameters.fold_number}
  group: BI_P300_BASELINES
  tags: [p300, brain_invaders, baseline, from_scratch]
  log_level: INFO
  project: foundry_finetuning
  compile: default

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: null
  sampling_rate: 512
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      model/tokenizer: per_channel_cwt_cnn, per_channel_resample_cnn
      model.channel_emb_mode: disabled, dynamic
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment p300/brain_invaders_baselines"

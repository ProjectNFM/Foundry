# @package _global_
#
# EEGNet baseline on Brain Invaders P300.
#
# Intersubject 3-fold CV.
#
# Launch all 3 folds on SLURM:
#   uv run python main.py experiment=p300/eegnet_brain_invaders_baselines -m
#
# Local singlesess smoke test:
#   uv run python main.py experiment=p300/eegnet_brain_invaders_baselines \
#       data=brain_invaders_p300/singlesess data.split_type=intrasession \
#       trainer.max_epochs=2

defaults:
  - override /model: eegnet
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  num_samples: 512

data:
  split_type: intersubject
  task_type: p300

stage:
  skip: true

run:
  name: bi_p300_eegnet_fold${hyperparameters.fold_number}
  group: BI_P300_BASELINES
  tags: [p300, eegnet, brain_invaders, baseline, from_scratch]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 0.1

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 512
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 1000
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 20
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment p300/eegnet_brain_invaders_baselines"

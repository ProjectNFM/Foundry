# @package _global_
#
# EEGNet HP search on reprocessed Brain Invaders P300 data.
#
# Sweeps learning rate with class weights fixed to auto.
# Single fold (fold 0) — best config to be re-run on all 3 folds.
#
# Launch all 5 jobs on SLURM (5 lr values):
#   uv run python main.py experiment=p300/brain_invaders_hp_eegnet_reprocessed -m

defaults:
  - override /model: eegnet
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  num_samples: 512
  F1: 8
  kernel_length: 128
  dropout_rate: 0.5

data:
  split_type: intersubject
  task_type: p300


run:
  name: bi_p300_eegnet_reproc_v2_lr${hyperparameters.learning_rate}
  group: BI_P300_HP_EEGNET_REPROCESSED_V2
  tags: [p300, brain_invaders, hp_search, eegnet, reprocessed]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 512
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.learning_rate: 1e-3, 5e-4, 1e-4, 5e-5, 1e-5
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

# @package _global_
#
# Finetune a data-scaling pretrained checkpoint on Brain Invaders P300 binary.
# Fixed model: CWT-CNN + dynamic channel_emb.
#
# Launch (3 folds for one checkpoint):
#   uv run python main.py experiment=p300/brain_invaders_finetune_from_data_scaling \
#     run.pretrain_run_name=pretrain_A1_klinzing_small \
#     run.pretrain_group=DATA_SCALING_VOLUME -m

defaults:
  - override /model: poyo_eeg
  - override /model/tokenizer: per_channel_cwt_cnn
  - override /model/session_emb: disabled
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  zero_output_timestamps: true
  normalize_inputs: true
  channel_emb_mode: dynamic
  embed_dim: 256
  depth: 4

data:
  split_type: intersubject
  task_type: p300


run:
  pretrain_run_name: ???
  pretrain_group: ???
  name: bi_ft_${run.pretrain_run_name}_fold${hyperparameters.fold_number}
  group: BI_P300_FT_DATA_SCALING
  tags: [p300, brain_invaders, finetuning, pretrained, data_scaling]
  log_level: INFO
  project: foundry_finetuning
  compile: default
  pretrained_checkpoint: ${oc.env:SCRATCH}/runs/${run.pretrain_group}/${run.pretrain_run_name}/checkpoints/last.ckpt
  pretrained_transfer_mode: permissive
  freeze_pretrained: false
  resume_wandb_if_name_matches: true

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: null
  sampling_rate: 512
  fold_number: 0
  num_workers: 6
  num_channels: null
  session_configs: null
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "ulimit -n 65536"
      - "set -a"
      - "source .env || true"
      - "set +a"
      - "export RANK=0"

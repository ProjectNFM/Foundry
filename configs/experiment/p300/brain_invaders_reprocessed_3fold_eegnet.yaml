# @package _global_
#
# Brain Invaders P300 reprocessed — EEGNet 3-fold baseline.
# Both intersubject and intrasession splits for comparison.
#
# Uses best HP from HP search: lr=1e-3, class_weights=auto (smoothing=1.0),
# kernel_length=128.
#
# Launch all 6 jobs on SLURM (3 folds × 2 split_types):
#   uv run python main.py experiment=p300/brain_invaders_reprocessed_3fold_eegnet -m

defaults:
  - override /model: eegnet
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  num_samples: 512
  F1: 8
  kernel_length: 128
  dropout_rate: 0.5

data:
  split_type: intersubject
  task_type: p300

stage:
  skip: true

run:
  name: bi_p300_reproc_${data.split_type}_eegnet_fold${hyperparameters.fold_number}
  group: BI_P300_REPROC_3FOLD
  tags: [p300, brain_invaders, eegnet, baseline, reprocessed, from_scratch, 3fold]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 512
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-3
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      data.split_type: intersubject, intrasession
      hyperparameters.fold_number: 0, 1, 2
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"
      - "uv run python -m foundry.tools.stage_data --experiment p300/brain_invaders_reprocessed_3fold_eegnet"

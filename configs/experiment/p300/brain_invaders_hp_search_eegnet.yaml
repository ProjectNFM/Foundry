# @package _global_
#
# HP search for EEGNet on Brain Invaders P300.
#
# Sweeps learning rate, class weight smoothing, and spatial filter count (F1).
# Single fold (fold 0) — best config to be re-run on all 3 folds.
#
# Launch all 12 jobs on SLURM (3 lr × 2 class_weights.mode × 2 F1):
#   uv run python main.py experiment=p300/brain_invaders_hp_search_eegnet -m

defaults:
  - override /model: eegnet
  - override /data: brain_invaders_p300/allsess
  - override /hydra/launcher: slurm_default

task_configs:
  - p300_binary

model:
  num_samples: 512
  F1: 8
  kernel_length: 128
  dropout_rate: 0.5

data:
  split_type: intersubject
  task_type: p300


run:
  name: bi_p300_hp_eegnet_lr${hyperparameters.learning_rate}_cw-${class_weights.mode}_F1-${model.F1}
  group: BI_P300_HP_SEARCH_EEGNET
  tags: [p300, brain_invaders, hp_search, eegnet]
  log_level: INFO
  project: foundry_finetuning

class_weights:
  mode: auto
  smoothing: 1.0

hyperparameters:
  batch_size: 64
  sequence_length: 1.0
  patch_duration: 0.1
  sampling_rate: 512
  fold_number: 0
  num_workers: 8
  learning_rate: 1e-4
  weight_decay: 0.01

trainer:
  max_epochs: 500
  precision: bf16-mixed
  callbacks:
    early_stopping:
      monitor: val/p300_binary_f1
      mode: max
      patience: 50
    model_checkpoint:
      monitor: val/p300_binary_f1
      mode: max
      auto_insert_metric_name: false
      filename: "best-epoch{epoch:03d}-val_f1_{val/p300_binary_f1:.4f}"

hydra:
  sweeper:
    params:
      hyperparameters.learning_rate: 1e-3, 5e-4, 1e-4
      class_weights.mode: none, auto
      model.F1: 8, 16
  launcher:
    tasks_per_node: 1
    cpus_per_task: 6
    mem_gb: 32
    gres: gpu:l40s:1
    timeout_min: 720
    max_num_timeout: 5
    setup:
      - "set -a"
      - "source .env"
      - "set +a"
      - "export RANK=0"

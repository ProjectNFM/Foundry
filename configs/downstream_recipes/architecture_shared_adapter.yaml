    model_overrides: {input_adapter_mode: per_session, input_adapter_bias: true}
  - id: transfer_shared_retained
    source: pretrained
    transfer_regime: full_finetuning_retain_shared_adapter_reset_router
    scratch_family: shared-padded
    backbone_lr_multiplier: 0.1
    adapter_warmup_steps: 0
    model_overrides: {input_adapter_mode: shared_padded, input_adapter_bias: true, shared_input_channels: 32}
  - id: scratch_shared_padded
    source: scratch
    transfer_regime: null
    source_condition: scratch-shared-padded
    scratch_family: shared-padded
    backbone_lr_multiplier: null
    adapter_warmup_steps: 0
    model_overrides: {temporal_channels: 128, gru_hidden_size: 128, input_adapter_mode: shared_padded, input_adapter_bias: true, shared_input_channels: 32}
condition_labels: {study: architecture_transfer, architecture_family: shared_padded, target_data: full}
species:

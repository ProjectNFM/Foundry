target_finetuning_seeds: [42, 43, 44]
expected_source_seed_pairs: [[42, 42]]
checkpoint_model_fields: [temporal_channels, gru_hidden_size]
evaluate_test: true
learning_rates: [0.003]
fixed_overrides:

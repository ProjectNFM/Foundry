  - hyperparameters.scheduler_interval=step
  - hyperparameters.hold=0
  - hyperparameters.decay=0
condition_matrix:
  - id: transfer_shared_to_ordinary
    source: pretrained
    transfer_regime: full_finetuning_reset_router
    scratch_family: shared-padded

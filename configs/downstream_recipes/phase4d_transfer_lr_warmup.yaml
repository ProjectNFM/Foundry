      transfer_adapter_warmup_uniform: PHASE4D_TRANSFER_ADAPTER_WARMUP_UNIFORM_MONKEYS
      transfer_adapter_warmup_discriminative: PHASE4D_TRANSFER_ADAPTER_WARMUP_DISCRIMINATIVE_MONKEYS
      scratch_uniform: PHASE4D_SCRATCH_UNIFORM_MONKEYS
      scratch_adapter_warmup: PHASE4D_SCRATCH_ADAPTER_WARMUP_MONKEYS
    wandb_tags_by_regime:
      transfer_uniform: [transfer, monkeys, 8band, phase4d, uniform]
      transfer_discriminative: [transfer, monkeys, 8band, phase4d, discriminative]
      transfer_adapter_warmup_uniform: [transfer, monkeys, 8band, phase4d, adapter-warmup, uniform]
      transfer_adapter_warmup_discriminative: [transfer, monkeys, 8band, phase4d, adapter-warmup, discriminative]
      scratch_uniform: [scratch, monkeys, 8band, phase4d, uniform]
      scratch_adapter_warmup: [scratch, monkeys, 8band, phase4d, adapter-warmup]

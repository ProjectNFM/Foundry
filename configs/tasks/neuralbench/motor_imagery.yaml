name: neuralbench_motor_imagery

class_mapping:
  mapping:
    imagery_bilateral_fist: Both Fists
    imagery_bilateral_feet: Both Feet
    imagery_left_fist: Left Fist
    imagery_right_fist: Right Fist
  order: [Both Feet, Both Fists, Left Fist, Right Fist]

head:
  _target_: foundry.tasks.heads.ReadoutHead

target_extractor:
  _target_: foundry.tasks.targets.TargetExtractor
  timestamp_key: motor_imagery_trials.timestamps
  value_key: motor_imagery_trials.targets

loss:
  _target_: foundry.tasks.losses.CrossEntropyTaskLoss
  label_smoothing: 0.1

metrics:
  _target_: foundry.tasks.metrics.classification_metrics

metric_summary_modes:
  acc: max
  f1: max
  auroc: max
  balanced_acc: max
  loss: min

defaults:
  - model: null
  - data: null
  - module: default
  - cluster: default
  - logger: wandb
  - _self_
  - trainer: default
  - profiling: default
  - experiment: ???

hyperparameters:
  batch_size: ???
  sequence_length: ???
  patch_duration: ???
  sampling_rate: ???
  fold_number: ???
  num_workers: ???
  warmup: 0
  start_lr_factor: 1e-4
  hold: 0
  hold_scheduler_type: "constant"
  decay: 0
  end_lr_factor: 0.1
  scheduler_interval: "epoch"
  learning_rate: ???  
  weight_decay: ???
  # "phased" is Foundry's warmup/hold/decay scheduler; "onecycle" mirrors
  # NeuralBench's EEGNet optimizer schedule.
  scheduler_name: phased
  cwt_lr_multiplier: 1.0
  backbone_learning_rate: null

extract:
  output_dir: outputs/embeddings/default
  max_batches: null

stage:
  # Stage from shared storage when a node-local destination is available.
  # Local runs without SLURM_TMPDIR continue to use data.root directly.
  mode: node_local
  destination_root: null
  compress: false

class_weights:
  mode: none
  smoothing: 0.5

run:
  seed: 42
  # Enable torch deterministic algorithms for bitwise reproducibility
  # (slower; leave false for normal training).
  deterministic: false
  # Keep fresh runs independent unless resume is explicitly requested.
  # SLURM restarts still auto-resume from last.ckpt in main.py.
  resume_if_checkpoint_exists: false
  # Evaluate the best validation checkpoint on the datamodule's test split
  # after fitting. Disabled by default to prevent accidental test-set use.
  evaluate_test: false
  # Transfer mode for pretrained weight loading: "strict" (default) raises
  # on missing/mismatched keys; "permissive" loads what it can and warns.
  # Null selects random initialization; downstream transfer experiments set
  # this to a Lightning pretraining checkpoint.
  pretrained_checkpoint: null
  pretrained_transfer_mode: strict
  # Optional model-declared transfer regime (for example,
  # ``frozen_representation``). Null uses transferable_components().
  pretrained_transfer_regime: null
  # Freeze the pretrained weights during training.
  freeze_pretrained: false
  # Freeze backbone (transferable components) even without a pretrained checkpoint.
  # Used for random-init linear probing baselines.
  freeze_backbone: false
  # Reuse a WandB run ID derived from run.name.
  # Keeps dashboards continuous for preempted/relaunched runs with same name.
  resume_wandb_if_name_matches: false
  # A100 benefits from Tensor Core-enabled FP32 matmul kernels.
  float32_matmul_precision: high
  # torch.compile the model for ~2x faster training on modern GPUs.
  # Adds ~60s compilation overhead on first step.
  # Options: false, "default", "reduce-overhead", "max-autotune"
  compile: false
  # Checkpoint manifest for Phase 3+ manifest-based transfer.
  # Mutually exclusive with pretrained_checkpoint.
  pretrained_checkpoint_manifest: null

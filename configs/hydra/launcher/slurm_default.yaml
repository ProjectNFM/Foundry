defaults:
  - foundry_submitit_slurm

_target_: hydra_plugins.foundry_launcher.packed_launcher.SlurmLauncher
name: ${run.group}
submitit_folder: ${hydra.sweep.dir}/slurm_logs/%j
stderr_to_stdout: true
timeout_min: 180
signal_delay_s: 300
tasks_per_node: 1
cpus_per_task: ${hyperparameters.num_workers}
nodes: 1
mem_gb: 32
gres: gpu:1
array_parallelism: 256
additional_parameters:
  requeue: true
setup:
  - "ulimit -n 65536"
  - "export RANK=0"

snapshot:
  enabled: true
  # Set FOUNDRY_SNAPSHOT_ROOT to a compute-node-visible shared directory when
  # the checkout itself is not shared. Null falls back to <checkout>/.snapshots.
  root: ${oc.env:FOUNDRY_SNAPSHOT_ROOT,null}
  require_clean_git: true
  verify_on_worker: true
  environment_file: ${oc.env:FOUNDRY_ENV_FILE,".env"}

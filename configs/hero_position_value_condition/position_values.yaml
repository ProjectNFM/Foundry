# @package _global_
#
# Correctly bound absolute position is added to each channel value before the
# permutation-invariant spatial mixer.  Position is deliberately not a
# routing-logit source in this isolated pilot.
condition_name: position_values

model:
  channel_context_mode: disabled
  channel_type_enabled: false
  absolute_position_enabled: false
  position_value_enabled: true
  context_gate_init: 0.0

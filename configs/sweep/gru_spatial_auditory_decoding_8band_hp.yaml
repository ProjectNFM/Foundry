# WandB grid for GRU + spatial CNN on NeuroSoft 8-band auditory decoding.
#
# Spatial conv uses kernel (K, 1) over session-projected sources, so
# conv_kernel and conv_depth_multiplier are unused and omitted here.
#
# Grid: 2 split × 2 use_input_proj × 2 conv_filters × 2 num_sources = 16
#
#   wandb sweep configs/sweep/gru_spatial_auditory_decoding_8band_hp.yaml
#   WANDB_SWEEP_EXPERIMENT=auditory_decoding/gru_neurosoft_8band_intrasession_multisubj \
#       uv run python -m foundry.wandb_sweep_agent_worker <entity>/<project>/<sweep-id>

defaults:
  - default

method: grid
metric:
  name: val/neurosoft_acoustic_stim_8band_f1
  goal: maximize
parameters:
  model.conv:
    value: spatial
  data.split_type:
    values:
      - intrasession-causal
  hyperparameters.batch_size:
    values:
      - 128
  hyperparameters.learning_rate:
    values:
      - 2.5e-4
  hyperparameters.weight_decay:
    values:
      - 0.01
  hyperparameters.num_sources:
    values:
      - 32
      - 64
      - 128
  model.use_input_proj:
    values:
      - true
      - false
  model.conv_filters:
    values:
      - 8
      - 16
      - 32

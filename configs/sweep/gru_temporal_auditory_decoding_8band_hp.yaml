# WandB grid for GRU + temporal CNN on NeuroSoft 8-band auditory decoding.
#
# Temporal conv uses kernel (1, L) and keeps the source axis, so
# conv_depth_multiplier is unused and omitted. conv_kernel is in samples
# (~2 kHz: 64/128/256 → 32/64/128 ms).
#
# With use_input_proj=false, GRU input_size = conv_filters × num_sources
# (max here: 16 × 64 = 1024).
#
# Grid: 2 split × 2 use_input_proj × 2 conv_filters × 3 conv_kernel × 2 num_sources = 48
#
#   wandb sweep configs/sweep/gru_temporal_auditory_decoding_8band_hp.yaml
#   WANDB_SWEEP_EXPERIMENT=auditory_decoding/gru_neurosoft_8band_intrasession_multisubj \
#       uv run python -m foundry.wandb_sweep_agent_worker <entity>/<project>/<sweep-id>

defaults:
  - default

method: grid
metric:
  name: val/neurosoft_acoustic_stim_8band_f1
  goal: maximize
parameters:
  model.conv:
    value: temporal
  data.split_type:
    values:
      - intrasession-causal
  hyperparameters.batch_size:
    values:
      - 128
  hyperparameters.learning_rate:
    values:
      - 2.5e-4
  hyperparameters.weight_decay:
    values:
      - 0.01
  hyperparameters.num_sources:
    values:
      - 32
      - 64
      - 128
  model.use_input_proj:
    values:
      - true
      - false
  model.conv_filters:
    values:
      - 8
      - 16
      - 32
  model.conv_kernel:
    values:
      - 64
      - 128
      - 256
